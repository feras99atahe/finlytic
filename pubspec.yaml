name: finlytic
description: A smart personal finance tracker with multi-wallet management, goals, and analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0      # Desktop support (Windows/Linux/macOS)
  sqflite_common_ffi_web: ^0.4.4  # Web support
  path_provider: ^2.1.1
  path: ^1.8.3

  # State management
  provider: ^6.1.1

  # Charts & visualization
  fl_chart: ^0.66.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0

  # CSV import
  file_picker: ^8.1.2
  csv: ^6.0.0
  share_plus: ^10.0.0

  # UI
  google_fonts: ^6.1.0
  flutter_slidable: ^3.0.1

  # Local reminder notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.0.0

  # Home-screen quick-add widget
  home_widget: ^0.7.0

  # App lock (biometric + PIN)
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/finlytic_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#141413"
  adaptive_icon_foreground: "assets/icon/finlytic_foreground.png"

flutter:
  uses-material-design: true
